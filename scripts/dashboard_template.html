<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: instrument panel. A sticky filter bar scopes every tab; each tab is a stack of quiet chart cards.
   Color: validated categorical slots (blue, orange, aqua) identify sport; one blue ramp carries magnitude; status colors only for state.
   Type: IBM Plex Sans for reading, IBM Plex Mono for axis ticks and figures in tables. */
:root {
  --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.045);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; --good-text: #006300;
  --z1: #86b6ef; --z2: #2a78d6; --z3: #104281;
  --h0: #edeceb; --h1: #cde2fb; --h2: #9ec5f4; --h3: #6da7ec; --h4: #3987e5; --h5: #1c5cab; --h6: #0d366b;
  --on-fill: #ffffff; --accent: #2a78d6;
  --wash-a: rgba(42,120,214,.075); --shadow: 0 1px 2px rgba(11,11,11,.04), 0 8px 20px -10px rgba(11,11,11,.10); --r: 14px;
  --t-e: #1baf7a; --t-m: #eda100; --t-h: #eb6834; --t-l: #2a78d6; --t-x: #6250d6; --t-r: #e34948;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --good-text: #0ca30c;
    --z1: #184f95; --z2: #3987e5; --z3: #9ec5f4;
    --h0: #242422; --h1: #184f95; --h2: #1c5cab; --h3: #256abf; --h4: #3987e5; --h5: #6da7ec; --h6: #9ec5f4;
    --accent: #3987e5; color-scheme: dark; --wash-a: rgba(57,135,229,.14); --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -12px rgba(0,0,0,.6);
  --t-e: #199e70; --t-m: #c98500; --t-h: #d95926; --t-l: #3987e5; --t-x: #9085e9; --t-r: #e66767;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --good-text: #0ca30c;
  --z1: #184f95; --z2: #3987e5; --z3: #9ec5f4;
  --h0: #242422; --h1: #184f95; --h2: #1c5cab; --h3: #256abf; --h4: #3987e5; --h5: #6da7ec; --h6: #9ec5f4;
  --accent: #3987e5; color-scheme: dark; --wash-a: rgba(57,135,229,.14); --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -12px rgba(0,0,0,.6);
  --t-e: #199e70; --t-m: #c98500; --t-h: #d95926; --t-l: #3987e5; --t-x: #9085e9; --t-r: #e66767;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 30; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
@supports (backdrop-filter: blur(8px)) { header.top { background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); } }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px 8px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; margin-right: auto; }
.logo { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.logo svg { width: 20px; height: 20px; }
.brand .bt { min-width: 0; }
.brand h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.015em; white-space: nowrap; line-height: 1.2; }
.brand #cov { display: block; color: var(--muted); font-size: 12px; font-family: var(--mono); margin-top: 1px; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); }
.seg button { font: 500 12px var(--sans); color: var(--ink2); background: none; border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; min-height: 30px; transition: background .12s, color .12s; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--wash); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dates { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.dates input { font: 12px var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; min-height: 36px; min-width: 0; width: 134px; }
.icon { font: 500 12px var(--sans); color: var(--ink2); background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; cursor: pointer; min-height: 36px; }
.icon:hover { background: var(--wash); }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0; }
nav.tabs { padding: 2px 0 12px; }
nav.tabs a { font-weight: 500; font-size: 13px; color: var(--ink2); text-decoration: none; padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
nav.tabs a:hover { color: var(--ink); background: var(--wash); }
nav.tabs a[aria-current="page"] { color: var(--ink); background: var(--wash); box-shadow: inset 0 0 0 1px var(--border); }
main { padding-block: 26px 72px; display: flex; flex-direction: column; gap: 22px; }
.note { color: var(--ink2); font-size: 13px; max-width: 78ch; margin: 0; }
.note strong { color: var(--ink); font-weight: 600; }
.row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); }
.row.wide { grid-template-columns: 1fr; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 15px 16px; min-width: 0; }
.tile .l { color: var(--ink2); font-size: 12px; }
.tile .v { font-size: 30px; font-weight: 500; letter-spacing: -.025em; margin-top: 4px; line-height: 1.1; }
.tile .v small { font-size: 13px; color: var(--ink2); font-weight: 400; margin-left: 3px; letter-spacing: 0; }
.tile .d { font: 12px var(--mono); color: var(--ink2); margin-top: 4px; }
.tile .d.txt { font: 12.5px/1.45 var(--sans); }
.tile .d.good { color: var(--good-text); }
.tile .d.bad { color: var(--crit); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 18px 12px; min-width: 0; }
.card h2, h2.sec { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -.005em; }
h2.sec { font-size: 17px; letter-spacing: -.015em; margin-top: 6px; }
.card .sub { color: var(--ink2); font-size: 12px; margin: 2px 0 8px; max-width: 80ch; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 6px; font-size: 12px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.k-line { width: 14px; height: 2px; border-radius: 1px; }
.k-box { width: 10px; height: 10px; border-radius: 2px; }
.k-dot { width: 8px; height: 8px; border-radius: 50%; }
.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
details.tbl { margin-top: 6px; }
details.tbl summary { cursor: pointer; font-size: 12px; color: var(--ink2); padding: 4px 0; width: max-content; }
.tscroll { overflow-x: auto; max-height: 280px; overflow-y: auto; border-top: 1px solid var(--border); margin-top: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: top; }
th { color: var(--ink2); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; padding-right: 12px; }
td.wrap-ok { white-space: normal; min-width: 180px; }
tr.base td { color: var(--ink2); font-style: italic; }
.tbl-wrap { overflow-x: auto; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px 2px 8px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
.pill i { width: 8px; height: 8px; display: inline-block; }
.pill.good i { background: var(--good); border-radius: 50%; }
.pill.warn i { background: var(--warn); transform: rotate(45deg); }
.pill.serious i { background: var(--serious); border-radius: 1px; }
.pill.crit i { background: var(--crit); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.pill.neutral i { background: var(--muted); border-radius: 50%; }
.status { display: grid; gap: 0; }
.status .r { display: grid; grid-template-columns: minmax(120px, 1.2fr) minmax(80px, 1fr) 2fr; gap: 6px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.status .r:last-child { border-bottom: 0; }
.status .r .a { color: var(--ink2); }
.status .r .b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.status .r .c { color: var(--ink2); font-size: 12.5px; }
@media (max-width: 560px) { .status .r { grid-template-columns: 1fr auto; } .status .r .c { grid-column: 1 / -1; } }
.heat { display: grid; grid-template-columns: 42px repeat(12, minmax(0, 1fr)); gap: 3px; align-items: center; font: 11px var(--mono); color: var(--muted); }
.heat .cell { aspect-ratio: 2.6; min-height: 14px; border-radius: 3px; background: var(--h0); }
.heat .cell:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.heat .hd { text-align: center; }
.ramp { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--muted); margin-top: 8px; }
.ramp i { display: inline-block; width: 22px; height: 8px; border-radius: 2px; }
#tip { position: fixed; z-index: 50; pointer-events: none; opacity: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.14); max-width: 280px; transition: opacity .08s; }
#tip .h { color: var(--ink2); margin-bottom: 4px; font-family: var(--mono); font-size: 11px; }
#tip .t { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
#tip .t b { font-weight: 600; margin-left: auto; padding-left: 12px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
#tip .x { color: var(--ink2); margin-top: 3px; }
.stackbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin-top: 4px; }
.stackbar i { display: block; height: 100%; }
.empty { color: var(--muted); font-size: 13px; padding: 22px 0; text-align: center; }
ul.plain { margin: 0; padding-left: 18px; color: var(--ink2); font-size: 13px; max-width: 80ch; }
ul.plain li { margin: 4px 0; }
code { font-family: var(--mono); font-size: 12px; background: var(--wash); padding: 1px 5px; border-radius: 4px; }
.sechead { margin-top: 10px; }
.sechead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; padding: 30px; border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); background: radial-gradient(120% 140% at 100% 0%, var(--wash-a), transparent 60%), var(--surface); }
.eyebrow { font: 500 11.5px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.hero h2 { font-size: clamp(26px, 3.6vw, 38px); line-height: 1.1; letter-spacing: -.025em; font-weight: 600; margin: 10px 0 12px; }
.hero p { color: var(--ink2); font-size: 15px; line-height: 1.55; max-width: 54ch; margin: 0 0 8px; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 10px 32px; margin-top: 22px; }
.hero-stats div { min-width: 0; }
.hero-stats b { display: block; font: 500 22px var(--sans); letter-spacing: -.02em; }
.hero-stats span { color: var(--muted); font-size: 12px; }
.hero-r { display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
.hero .big { font-size: 64px; font-weight: 500; letter-spacing: -.035em; line-height: 1; margin: 6px 0 2px; }
.hero .cap { color: var(--ink2); font-size: 13px; margin-bottom: 14px; }
.spark svg { display: block; width: 100%; height: auto; overflow: visible; }
.stat-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 15px 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; min-width: 0; }
.stat .a { color: var(--ink2); font-size: 12.5px; }
.stat .b { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
.stat .c { color: var(--muted); font-size: 12px; line-height: 1.45; margin: 0; }
@media (max-width: 560px) { .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat .c { display: none; } .stat .b { font-size: 22px; } }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; padding: 22px 20px; gap: 20px; } .hero .big { font-size: 56px; } }

body.mar #presets, body.mar .dates, body.mar #sports { display: none; }
.stackv { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.mhero .big { font-size: 80px; letter-spacing: -.04em; }
.mhero .phase { font-weight: 600; font-size: 15px; margin: 2px 0 12px; }
.mhero .hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.mhero .ghint { color: var(--ink2); font-size: 13px; margin: 14px 0 0; max-width: 46ch; }
.mhero .hero-r { justify-content: flex-start; gap: 8px; }
.mhero select { font: 500 15px var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; min-height: 40px; width: max-content; max-width: 100%; }
.mhero .hero-stats { margin-top: 14px; gap: 10px 26px; }
.meter { height: 8px; border-radius: 999px; background: var(--wash); overflow: hidden; max-width: 420px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.meter.thin { height: 5px; max-width: none; }
.mviews { align-self: flex-start; flex-wrap: wrap; border-radius: 18px; }
.calnav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
.calnav .seg { margin-left: auto; }
.calnav .icon:disabled { opacity: .35; cursor: default; }
.calt { font-size: 22px; letter-spacing: -.025em; margin: 0 8px; min-width: 9.5ch; font-weight: 600; }
.mlegend { margin: 4px 0 12px; gap: 6px 16px; }
.k-dash { display: inline-block; width: 14px; height: 10px; border: 1.5px dashed var(--ink2); border-radius: 3px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(104px, .85fr); gap: 6px; padding-bottom: 8px; }
.cal .wd { font: 500 11.5px var(--mono); color: var(--muted); padding: 0 4px 2px; }
.day { min-height: 98px; border: 1px solid var(--border); border-radius: 12px; padding: 6px 6px 7px; background: var(--bg); display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0; }
.day:hover { background: var(--wash); }
.day.out { opacity: .4; }
.day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.day.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.day.race { background: color-mix(in srgb, var(--t-r) 10%, var(--bg)); }
.dtop { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.dn { font: 500 11.5px var(--mono); color: var(--ink2); }
.dp { font: 10.5px var(--mono); color: var(--muted); white-space: nowrap; }
.cp { --c: var(--ink2); display: flex; align-items: center; gap: 5px; border-radius: 7px; padding: 2px 6px; font: 600 11.5px/1.4 var(--sans); min-width: 0; }
.cp .ck { font: 700 10px var(--mono); opacity: .9; }
.cp .cv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-E { --c: var(--t-e); } .t-M { --c: var(--t-m); } .t-H { --c: var(--t-h); } .t-L { --c: var(--t-l); } .t-X { --c: var(--t-x); } .t-R { --c: var(--t-r); }
.cp.done { background: var(--c); color: #fff; }
.cp.done.t-M { color: #0b0b0b; }
.cp.plan { border: 1.5px dashed var(--c); background: color-mix(in srgb, var(--c) 9%, transparent); color: var(--ink2); padding: 0 5px; }
.skip, .rest, .more { font-size: 11px; color: var(--muted); }
.skip { font-style: italic; }
.wsc { border-radius: 12px; padding: 8px 10px; background: var(--wash); display: flex; flex-direction: column; gap: 4px; justify-content: center; min-width: 0; }
.wsc.cur { background: var(--wash-a); box-shadow: inset 0 0 0 1px var(--border); }
.wsc .wl { font-size: 11px; color: var(--muted); }
.wsc .wv b { font-size: 20px; letter-spacing: -.02em; font-weight: 600; }
.wsc .wv span { font-size: 11.5px; color: var(--ink2); }
.detail .dh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
.dcols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding-bottom: 8px; }
.dcol p { margin: 6px 0 0; font-size: 13.5px; }
.dcol p.muted, .muted { color: var(--ink2); font-size: 12.5px; }
.dline { display: flex; align-items: center; gap: 8px; margin-top: 6px; }

.act + .act { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); }
.dnote { border-left: 3px solid var(--t-h); padding-left: 10px; color: var(--ink) !important; }
.next7 { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.nd { --c: var(--axis); text-align: left; border: 1px solid var(--border); border-left: 4px solid var(--c); background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; padding: 10px 11px; cursor: pointer; font: inherit; color: inherit; min-width: 0; }
.nd:hover { background: var(--wash); }
.ndh { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); }
.ndh b { color: var(--ink); }
.ndm { font-size: 22px; font-weight: 500; letter-spacing: -.02em; margin: 4px 0 2px; }
.ndd { font-size: 12px; color: var(--ink2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }

.callout { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--good); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 18px; }
